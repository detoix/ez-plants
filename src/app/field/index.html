<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#28362d" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <title>EZ-Plants · Field walkaround</title>
    <meta
      name="description"
      content="Several hundred instanced, level-of-detail plants in one walkable garden, with a live readout of draw calls, instances and frame cost."
    />
    <meta name="robots" content="noindex" />

    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/field.css" />
  </head>

  <body>
    <div
      id="loading-screen"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    >
      <div class="bc-loader-mark" aria-hidden="true">EZ-Plants</div>
      <div id="loading-text">Planting the field…</div>
    </div>

    <div id="root">
      <div
        id="app"
        role="region"
        aria-label="Walkable 3D field of plants"
      ></div>
      <div id="ui-container"></div>

      <div id="walk-hint" class="fx-hint">
        <strong>Click to walk</strong>
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</span>
        <span
          ><kbd>Shift</kbd> run · mouse to look · <kbd>Esc</kbd> to
          release</span
        >
        <span class="fx-hint-note">
          <code>?count=400&amp;day=230&amp;prototypes=3&amp;shadows=on</code>
        </span>
      </div>
    </div>

    <script type="module" src="../field.js"></script>
  </body>
</html>
